schema_version: 1

context:
  name: pywis-topics
  version: "0.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 6dfcd20a2bfe5c90ceaa5141406f2cba64c092dbc1020e39d7b2cfe510950275

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pywis-topics=pywis_topics:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click

tests:
  - python:
      imports:
        - pywis_topics
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - script:
      - pywis-topics --help

about:
  summary: pywis-topics is a utility to work with the WIS2 Topic Hierarchy
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/wmo-im/pywis-topics

extra:
  recipe-maintainers:
    - akrherz
